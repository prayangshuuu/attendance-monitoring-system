name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Check code formatting (ruff)
        run: uv run ruff format --check

      - name: Run linter (ruff)
        run: uv run ruff check

      - name: Run type checker (mypy)
        run: uv run mypy app

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run bandit SAST scan
        run: uv run bandit -r app

      - name: Run pip-audit vulnerability scan
        run: uv run pip-audit

  test:
    name: Test Suite with PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attendance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/attendance
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/attendance
      ENVIRONMENT: testing
      JWT_SECRET_KEY: change-me-32-byte-long-secret-key-attendance-system
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run pytest with coverage
        run: uv run pytest

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Build Docker image
        run: docker build -t attendance-monitoring:latest .

      - name: Verify non-root user
        run: |
          user=$(docker run --rm attendance-monitoring:latest whoami)
          echo "Container running as: $user"
          if [ "$user" != "appuser" ]; then
            echo "Expected appuser, got $user"
            exit 1
          fi

      - name: Verify .env and docs/ not in image
        run: |
          docker run --rm attendance-monitoring:latest ls -la /app
          if docker run --rm attendance-monitoring:latest ls -la /app | grep -E '(\.env$|docs)'; then
            echo "Forbidden file or directory detected in /app!"
            exit 1
          fi

      - name: Prepare .env for Docker Compose
        run: cp .env.example .env

      - name: Start Docker Compose stack
        run: docker compose up -d --wait

      - name: Run smoke test script
        run: uv run scripts/smoke_test.py

      - name: Docker Compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down -v
